<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>投資損益 — 瑞奇財務</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="瑞奇財務">
<meta name="theme-color" content="#161b22">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<link rel="stylesheet" href="/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* 帳戶分組 */
.broker-section { margin-bottom: 8px; }
.broker-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 4px;
}
.broker-name {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.6px;
  text-transform: uppercase;
}
.broker-summary { font-size: 12px; color: var(--text-muted); display: flex; gap: 12px; }

/* 個股卡片（可點擊） */
.inv-card {
  padding: 14px 8px;
  border-bottom: 1px solid rgba(48,54,61,0.5);
  cursor: pointer;
  border-radius: 8px;
  margin: 0 -8px;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.inv-card:last-child { border-bottom: none; }
.inv-card:hover { background: rgba(56,68,77,0.35); }
.inv-card:active { background: rgba(56,68,77,0.55); }
.inv-symbol {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
  font-family: monospace;
  letter-spacing: 0.5px;
}
.inv-name { font-size: 15px; font-weight: 600; margin-top: 1px; }

/* 詳情滑入面板 */
.detail-panel {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: var(--bg);
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.detail-panel.open { transform: translateX(0); }

.detail-topbar {
  position: sticky;
  top: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 10;
}
.detail-back-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 0;
  white-space: nowrap;
  flex-shrink: 0;
}
.detail-title-text {
  flex: 1;
  font-size: 16px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: center;
}
.detail-body {
  padding: 20px 16px;
  padding-bottom: calc(100px + env(safe-area-inset-bottom));
  max-width: 600px;
  margin: 0 auto;
}

/* 詳情表格 */
.detail-table {
  width: 100%;
  border-collapse: collapse;
}
.detail-table td {
  padding: 12px 0;
  border-bottom: 1px solid rgba(48,54,61,0.5);
  font-size: 14px;
}
.detail-table td:first-child { color: var(--text-muted); }
.detail-table td:last-child { text-align: right; font-weight: 500; }
.detail-table tr:last-child td { border-bottom: none; }

/* 損益區塊 */
.detail-pnl-block {
  background: var(--surface2);
  border-radius: 10px;
  padding: 4px 14px;
  margin-bottom: 24px;
}
.detail-pnl-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid rgba(48,54,61,0.4);
  font-size: 14px;
}
.detail-pnl-row:last-child { border-bottom: none; }
.detail-pnl-label { color: var(--text-muted); }

/* 交易記錄 */
.trade-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(48,54,61,0.3);
  font-size: 13px;
  gap: 8px;
}
.trade-row:last-child { border-bottom: none; }
.trade-type {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  flex-shrink: 0;
}
.type-buy { background: rgba(63,185,80,0.15); color: #3fb950; }
.type-sell { background: rgba(248,81,73,0.15); color: #f85149; }
.trade-del, .trade-edit {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 14px;
  opacity: 0.6;
  padding: 4px 8px;
  border-radius: 6px;
  flex-shrink: 0;
}
.trade-edit:active, .trade-edit:hover { opacity: 1; background: rgba(88,166,255,0.15); }
.trade-del:active, .trade-del:hover { opacity: 1; background: rgba(248,81,73,0.15); }
.trade-del:hover { opacity: 1; background: rgba(248,81,73,0.15); }

/* 更新市價 icon 按鈕 */
.btn-refresh-icon {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-muted);
  transition: background 0.15s, color 0.15s;
  flex-shrink: 0;
}
.btn-refresh-icon:hover { background: var(--surface2); color: var(--text); }
.btn-refresh-icon:disabled { opacity: 0.4; cursor: wait; }

/* loading spin */
.spin { display: inline-block; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo"><span>💰</span><span>瑞奇財務</span></div>
  <nav class="sidebar-nav">
    <a href="/" class="nav-item"><span class="icon">🏠</span><span>資產總覽</span></a>
    <a href="/transactions.html" class="nav-item"><span class="icon">📋</span><span>消費記錄</span></a>
    <a href="/reconcile.html" class="nav-item"><span class="icon">🔍</span><span>信用卡對帳</span></a>
    <a href="/investments.html" class="nav-item active"><span class="icon">📈</span><span>投資損益</span></a>
  </nav>
</aside>

<div class="main">
  <div class="header">
    <h1>投資損益</h1>
    <div class="header-actions">
      <button class="btn btn-secondary btn-sm btn-csv-upload" onclick="openUploadModal()">上傳 CSV</button>
      <button class="btn btn-primary btn-sm" onclick="openAddTradeModal()">+ 新增交易</button>
    </div>
  </div>

  <div class="content">
    <!-- 總覽卡片 -->
    <div class="grid-4" style="margin-bottom:20px">
      <div class="card">
        <div class="card-title">投資總市值</div>
        <div class="card-value blue" id="total-value">–</div>
        <div class="card-sub" id="total-cost-sub">–</div>
      </div>
      <div class="card">
        <div class="card-title">今日損益</div>
        <div class="card-value" id="total-daily-pnl">–</div>
        <div class="card-sub" id="holding-count">–</div>
      </div>
      <div class="card">
        <div class="card-title">未實現損益</div>
        <div class="card-value" id="total-pnl">–</div>
        <div class="card-sub" id="overall-return-sub">–</div>
      </div>
      <div class="card">
        <div class="card-title">已實現損益</div>
        <div class="card-value" id="total-realized-pnl">–</div>
        <div class="card-sub">累計賣出收益</div>
      </div>
    </div>

    <!-- 持股明細（按證券戶分組） -->

    <div class="card" style="margin-bottom:20px">
      <div class="section-header">
        <div class="section-title">持股明細</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div id="refresh-status" style="font-size:11px;color:var(--text-muted)"></div>
          <button class="btn-refresh-icon" id="refresh-all-btn" onclick="refreshAll()" title="更新市價">🔄</button>
        </div>
      </div>
      <div id="inv-list"><div class="loading">載入中…</div></div>
    </div>

    <!-- 圖表 -->
    <div class="grid-2" style="margin-bottom:20px">
      <div class="card">
        <div class="section-title" style="margin-bottom:12px">持股市值分布</div>
        <div class="chart-container" style="height:200px"><canvas id="holdingChart"></canvas></div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div class="section-title">投資資產成長</div>
          <div style="display:flex;gap:4px">
            <button id="btn-range-week" class="btn btn-sm btn-secondary" onclick="setGrowthRange('week')">週</button>
            <button id="btn-range-month" class="btn btn-sm" onclick="setGrowthRange('month')">月</button>
            <button id="btn-range-year" class="btn btn-sm btn-secondary" onclick="setGrowthRange('year')">年</button>
          </div>
        </div>
        <div class="chart-container" style="height:200px"><canvas id="growthChart"></canvas></div>
      </div>
    </div>
  </div>
</div>

<!-- ══ 個股詳情面板 ══ -->
<div id="detail-panel" class="detail-panel">
  <div class="detail-topbar">
    <button class="detail-back-btn" onclick="closeDetail()">← 返回</button>
    <div id="detail-title" class="detail-title-text"></div>
    <button class="btn btn-secondary btn-sm" onclick="openEditDetail()">編輯</button>
  </div>
  <div id="detail-body" class="detail-body"></div>
</div>

<!-- ══ 編輯持股 Modal ══ -->
<div class="modal-overlay" id="edit-inv-modal">
  <div class="modal" style="max-width:360px">
    <div class="modal-header">
      <div class="modal-title">編輯持股</div>
      <button class="modal-close" onclick="closeEditInv()">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">股數</label>
      <input type="number" id="edit-shares" step="1" min="0" placeholder="0" inputmode="numeric">
    </div>
    <div class="form-group">
      <label class="form-label">平均成本（元）</label>
      <input type="number" id="edit-avg-cost" step="0.01" min="0" placeholder="0.00" inputmode="decimal">
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeEditInv()">取消</button>
      <button class="btn btn-primary" onclick="saveEditInv()">儲存</button>
    </div>
  </div>
</div>

<!-- ══ 上傳 CSV Modal ══ -->
<div class="modal-overlay" id="upload-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">上傳 Holdary CSV</div>
      <button class="modal-close" onclick="closeUploadModal()">×</button>
    </div>
    <div class="upload-zone" id="csv-upload-zone" onclick="document.getElementById('csv-input').click()">
      <div style="font-size:32px">📊</div>
      <div style="margin-top:8px;font-weight:500">點擊或拖曳 CSV 檔案</div>
      <p>Holdary 匯出的投資組合 CSV</p>
    </div>
    <input type="file" id="csv-input" accept=".csv" style="display:none">
    <div id="csv-status" style="margin-top:12px;font-size:13px;color:var(--text-muted)"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeUploadModal()">取消</button>
    </div>
  </div>
</div>

<!-- ══ 新增交易 Modal ══ -->
<div class="modal-overlay" id="add-trade-modal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <div class="modal-title" id="trade-modal-title">新增交易</div>
      <button class="modal-close" onclick="closeAddTradeModal()">×</button>
    </div>

    <div class="form-group">
      <label class="form-label">股票代號</label>
      <div style="display:flex;gap:8px;align-items:flex-start">
        <div style="flex-shrink:0">
          <input type="text" id="trade-symbol" placeholder="如：0050" style="width:90px;text-transform:uppercase"
            oninput="onSymbolInput(this.value)">
        </div>
        <div style="flex:1">
          <input type="text" id="trade-name" placeholder="名稱（自動填入）" readonly
            style="background:var(--surface2);color:var(--text-muted)">
          <div id="trade-lookup-hint" style="font-size:11px;color:var(--text-muted);margin-top:4px;min-height:16px"></div>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">證券戶</label>
      <select id="trade-account"></select>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">類型</label>
        <select id="trade-type">
          <option value="買入">📈 買入</option>
          <option value="賣出">📉 賣出</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">日期</label>
        <input type="date" id="trade-date">
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">股數</label>
        <input type="number" id="trade-shares" placeholder="0" min="1" step="1" inputmode="numeric" oninput="calcTradeAmount()">
      </div>
      <div class="form-group">
        <label class="form-label">成交價（元）</label>
        <input type="number" id="trade-price" placeholder="0.00" step="0.01" inputmode="decimal" oninput="calcTradeAmount()">
      </div>
    </div>

    <div id="trade-amount-preview" style="display:none;padding:10px 12px;background:var(--surface2);border-radius:6px;font-size:13px;margin-bottom:8px;color:var(--text-muted)">
      預計交易金額：<strong id="trade-amount-value" style="color:var(--text)">–</strong>
    </div>

    <div class="form-group">
      <label class="form-label">備註（選填）</label>
      <input type="text" id="trade-note" placeholder="如：定期定額">
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeAddTradeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveTrade()">儲存</button>
    </div>
  </div>
</div>

<script type="module">
import { api, toast, formatMoney } from '/js/api.js'

let holdingChart = null
let growthChart = null
let allInvestments = []
let allTrades = {}
let brokerAccountNames = []
let lookupTimer = null
let currentGrowthRange = 'month'
let editingTradeId = null
let currentDetailId = null   // investment.id，唯一識別 (symbol, account) 組合

const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' })

// ── 資料載入 ──────────────────────────────
async function loadData() {
  const [invRes, tradeRes, assetsRes] = await Promise.all([
    api.getInvestments(),
    api.getInvestmentTrades(),
    api.getAssets(),
  ])

  // 從帳戶管理抓證券戶清單，fallback 到現有投資的帳戶名稱
  if (assetsRes?.ok) {
    const brokers = (assetsRes.data?.accounts ?? []).filter(a => a.type === '證券戶' || a.type === '投資帳戶')
    brokerAccountNames = brokers.map(a => a.name)
  }
  if (!invRes.ok) return false

  allInvestments = invRes.data

  allTrades = {}
  if (tradeRes.ok) {
    for (const t of tradeRes.data) {
      const key = t.symbol + '|' + t.account
      if (!allTrades[key]) allTrades[key] = []
      allTrades[key].push(t)
    }
  }

  renderSummary(invRes.summary)
  renderInvestmentCards()
  renderCharts()
  updateAccountDatalist()

  if (currentDetailId) {
    const stillExists = allInvestments.some(i => i.id === currentDetailId)
    if (stillExists) renderDetail(allInvestments.find(i => i.id === currentDetailId))
    else closeDetail()
  }
  return true
}

async function load() {
  await loadData()
  renderGrowthChart(currentGrowthRange)
  if (allInvestments.length > 0) refreshAll(true)
}

// ── 批量更新市價 ──────────────────────────
window.refreshAll = async function(silent = false) {
  const btn = document.getElementById('refresh-all-btn')
  const status = document.getElementById('refresh-status')
  if (btn) { btn.innerHTML = '<span class="spin">🔄</span>'; btn.disabled = true }
  if (status) status.textContent = '更新中…'

  const res = await api.refreshAllInvestmentPrices()

  if (btn) { btn.innerHTML = '🔄'; btn.disabled = false }

  if (res.ok) {
    const time = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })
    if (status) status.textContent = `已更新 ${res.updated}/${res.total} 檔　${time}`
    if (!silent) toast(`市價已更新（${res.updated}/${res.total} 檔）`)
    // 直接用回傳的資料更新 UI，不需要再打一次 GET
    if (res.data && res.summary) {
      allInvestments = res.data
      renderSummary(res.summary)
      renderInvestmentCards()
      renderCharts()
      if (currentDetailId) {
        const stillExists = allInvestments.some(i => i.id === currentDetailId)
        if (stillExists) renderDetail(allInvestments.find(i => i.id === currentDetailId))
        else closeDetail()
      }
    } else {
      await loadData()
    }
  } else {
    if (status) status.textContent = '更新失敗'
    if (!silent) toast('市價更新失敗', 'error')
  }
}

// ── 摘要卡片 ──────────────────────────────
function renderSummary(summary) {
  document.getElementById('total-value').textContent = formatMoney(summary.total_value)
  document.getElementById('total-cost-sub').textContent = `成本 ${formatMoney(Math.round(summary.total_cost))}`

  const dailyEl = document.getElementById('total-daily-pnl')
  if (summary.total_daily_pnl !== 0) {
    const sign = summary.total_daily_pnl >= 0 ? '+' : '-'
    dailyEl.textContent = sign + formatMoney(summary.total_daily_pnl)
    dailyEl.style.color = summary.total_daily_pnl >= 0 ? 'var(--success)' : 'var(--danger)'
  } else {
    dailyEl.textContent = '–'
    dailyEl.style.color = 'var(--text-muted)'
  }

  const pnlEl = document.getElementById('total-pnl')
  pnlEl.textContent = (summary.total_profit_loss >= 0 ? '+' : '-') + formatMoney(summary.total_profit_loss)
  pnlEl.style.color = summary.total_profit_loss >= 0 ? 'var(--success)' : 'var(--danger)'
  document.getElementById('overall-return-sub').textContent = (summary.overall_return >= 0 ? '+' : '-') + Math.abs(summary.overall_return).toFixed(2) + '%'

  const realEl = document.getElementById('total-realized-pnl')
  const rp = summary.total_realized_pnl ?? 0
  if (rp !== 0) {
    realEl.textContent = (rp >= 0 ? '+' : '-') + formatMoney(rp)
    realEl.style.color = rp >= 0 ? 'var(--success)' : 'var(--danger)'
  } else {
    realEl.textContent = '–'
    realEl.style.color = 'var(--text-muted)'
  }

  document.getElementById('holding-count').textContent = allInvestments.length + ' 檔持股'
}

// ── 持股卡片（按證券戶分組） ──────────────
function renderInvestmentCards() {
  const container = document.getElementById('inv-list')
  if (!allInvestments.length) {
    container.innerHTML = '<div class="empty-state">尚無持股<p>上傳 Holdary CSV 或新增交易記錄</p></div>'
    return
  }

  const groups = {}
  for (const inv of allInvestments) {
    if (!groups[inv.account]) groups[inv.account] = []
    groups[inv.account].push(inv)
  }

  let html = ''
  for (const [account, invs] of Object.entries(groups)) {
    const groupValue = invs.reduce((s, i) => s + i.market_value, 0)
    const groupPnl = invs.reduce((s, i) => s + i.profit_loss, 0)
    const pnlSign = groupPnl >= 0 ? '+' : '-'
    const pnlColor = groupPnl >= 0 ? 'var(--success)' : 'var(--danger)'

    html += `<div class="broker-section">
      <div class="broker-header">
        <span class="broker-name">🏦 ${escHtml(account)}</span>
        <div class="broker-summary">
          <span>${formatMoney(groupValue)}</span>
          <span style="color:${pnlColor}">${pnlSign}${formatMoney(groupPnl)}</span>
        </div>
      </div>`

    const totalValue = allInvestments.reduce((s, i) => s + i.market_value, 0)
    for (const inv of invs) html += renderInvCard(inv, totalValue)
    html += '</div>'
  }

  container.innerHTML = html
}

function renderInvCard(inv, totalPortfolio = 0) {
  const perShare = inv.current_price || (inv.shares > 0 ? inv.market_value / inv.shares : 0)
  const priceStr = perShare > 0
    ? '$' + perShare.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : '–'

  const s = v => v >= 0 ? '+' : '-'   // 正負號，formatMoney 已用 Math.abs

  // 現價漲跌
  let dailyRateStr = '', dailyColor = 'var(--text-muted)', dailyPnl = 0, dailyPnlStr = '–'
  if (inv.current_price && inv.previous_close && inv.previous_close > 0) {
    const rate = (inv.current_price - inv.previous_close) / inv.previous_close * 100
    dailyPnl = Math.round((inv.current_price - inv.previous_close) * inv.shares)
    dailyColor = rate >= 0 ? 'var(--success)' : 'var(--danger)'
    dailyRateStr = `${s(rate)}${Math.abs(rate).toFixed(2)}%`
    dailyPnlStr = `${s(dailyPnl)}${formatMoney(dailyPnl)}`
  }

  // 市值占比
  const weight = totalPortfolio > 0 ? (inv.market_value / totalPortfolio * 100).toFixed(1) : '–'

  // 累計損益
  const pnlColor = inv.profit_loss >= 0 ? 'var(--success)' : 'var(--danger)'
  const pnlSign = s(inv.profit_loss)

  return `<div class="inv-card" onclick="openDetail('${escJs(inv.id)}')">

    <!-- 第一行：名稱 + 現價 -->
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
      <div style="min-width:0;flex:1">

// ── 個股詳情面板 ──────────────────────────
window.openDetail = function(invId) {
  const inv = allInvestments.find(i => i.id === invId)
  if (!inv) return
  currentDetailId = invId
  renderDetail(inv)
  document.getElementById('detail-panel').classList.add('open')
}

window.closeDetail = function() {
  document.getElementById('detail-panel').classList.remove('open')
  currentDetailId = null
}

function renderDetail(inv) {
  if (!inv) return
  const symbol = inv.symbol

  document.getElementById('detail-title').textContent = inv.name

  const trades = allTrades[symbol + '|' + inv.account] ?? []
  const totalCost = Math.round(inv.shares * inv.avg_cost)
  const perShare = inv.current_price || (inv.shares > 0 ? inv.market_value / inv.shares : 0)
  const pnlColor = inv.profit_loss >= 0 ? 'var(--success)' : 'var(--danger)'
  const pnlSign = inv.profit_loss >= 0 ? '+' : '-'
  const priceDisplay = perShare > 0
    ? '$' + perShare.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    : '–'

  let dailyRow = ''
  if (inv.current_price && inv.previous_close) {
    const dailyPnl = Math.round((inv.current_price - inv.previous_close) * inv.shares)
    const dailyRate = ((inv.current_price - inv.previous_close) / inv.previous_close * 100).toFixed(2)
    const dSign = dailyPnl >= 0 ? '+' : '-'
    const dColor = dailyPnl >= 0 ? 'var(--success)' : 'var(--danger)'
    dailyRow = `<div class="detail-pnl-row">
      <span class="detail-pnl-label">今日損益</span>
      <span style="color:${dColor};font-weight:700">${dSign}${formatMoney(dailyPnl)}<span style="font-size:12px;font-weight:400;margin-left:6px">${dSign}${Math.abs(parseFloat(dailyRate)).toFixed(2)}%</span></span>
    </div>`
  }

  const tradesHtml = trades.length
    ? trades.map(t => `
      <div class="trade-row">
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
          <span class="trade-type type-${t.type === '買入' ? 'buy' : 'sell'}">${t.type}</span>
          <span>${t.shares.toLocaleString()} 股 @ $${t.price.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
          <div style="text-align:right">
            <div style="font-weight:600">${formatMoney(t.amount)}</div>
            <div style="font-size:11px;color:var(--text-muted)">${t.date}</div>
          </div>
          <button class="trade-edit" onclick="openEditTradeModal('${t.id}')" title="編輯">✏️</button>
          <button class="trade-del" onclick="deleteTrade('${t.id}','${symbol}')" title="刪除">🗑</button>
        </div>
      </div>`).join('')
    : '<div style="padding:20px 0;font-size:14px;color:var(--text-muted);text-align:center">尚無交易記錄</div>'

  document.getElementById('detail-body').innerHTML = `
    <div style="color:var(--text-muted);font-size:13px;margin-bottom:20px">🏦 ${escHtml(inv.account)}</div>

    <div class="card" style="margin-bottom:16px">
      <table class="detail-table">
        <tr><td>代號</td><td><span style="font-family:monospace;font-weight:700;color:var(--accent)">${inv.symbol}</span></td></tr>
        <tr><td>總股數</td><td>${inv.shares.toLocaleString()} 股</td></tr>
        <tr><td>平均成本</td><td>$${inv.avg_cost.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td></tr>
        <tr><td>市價</td><td>${priceDisplay}</td></tr>
        <tr><td>總成本</td><td>${formatMoney(totalCost)}</td></tr>
        <tr><td>市值</td><td><strong>${formatMoney(inv.market_value)}</strong></td></tr>
      </table>
    </div>

    <div class="detail-pnl-block">
      <div class="detail-pnl-row">
        <span class="detail-pnl-label">未實現損益</span>
        <span style="color:${pnlColor};font-weight:700">${pnlSign}${formatMoney(inv.profit_loss)}<span style="font-size:12px;font-weight:400;margin-left:6px">${pnlSign}${Math.abs(inv.return_rate).toFixed(2)}%</span></span>
      </div>
      ${dailyRow}
      ${(() => {
        const rp = inv.realized_pnl ?? 0
        if (rp === 0) return ''
        const rpSign = rp >= 0 ? '+' : '-'
        const rpColor = rp >= 0 ? 'var(--success)' : 'var(--danger)'
        return `<div class="detail-pnl-row">
          <span class="detail-pnl-label">已實現損益</span>
          <span style="color:${rpColor};font-weight:700">${rpSign}${formatMoney(rp)}</span>
        </div>`
      })()}
    </div>

    <div class="section-header" style="margin-bottom:12px">
      <div class="section-title">交易記錄</div>
      <button class="btn btn-primary btn-sm" onclick="openAddTradeModal('${inv.symbol}','${escJs(inv.name)}','${escJs(inv.account)}')">新增 +</button>
    </div>

    <div id="detail-trades">${tradesHtml}</div>
  `
}

// ── 新增交易 Modal ────────────────────────
function updateAccountDatalist() {
  // 優先用帳戶管理的證券戶，fallback 到現有投資紀錄的帳戶名稱
  const fromInvestments = [...new Set(allInvestments.map(i => i.account).filter(Boolean))]
  const opts = brokerAccountNames.length
    ? [...new Set([...brokerAccountNames, ...fromInvestments])]
    : fromInvestments
  const select = document.getElementById('trade-account')
  const prev = select.value
  select.innerHTML = opts.length
    ? opts.map(a => `<option value="${escHtml(a)}">${escHtml(a)}</option>`).join('')
    : '<option value="">（尚無證券戶）</option>'
  if (prev && opts.includes(prev)) select.value = prev
}

window.openAddTradeModal = function(symbol = '', name = '', account = '') {
  document.getElementById('trade-symbol').value = symbol
  document.getElementById('trade-name').value = name
  const acctSelect = document.getElementById('trade-account')
  const targetAcct = account || allInvestments[0]?.account || ''
  if (targetAcct && [...acctSelect.options].some(o => o.value === targetAcct)) {
    acctSelect.value = targetAcct
  } else if (acctSelect.options.length) {
    acctSelect.selectedIndex = 0
  }
  document.getElementById('trade-modal-title').textContent = '新增交易'
  document.getElementById('trade-symbol').readOnly = false
  editingTradeId = null
  document.getElementById('trade-type').value = '買入'
  document.getElementById('trade-date').value = today
  document.getElementById('trade-shares').value = ''
  document.getElementById('trade-price').value = ''
  document.getElementById('trade-note').value = ''
  document.getElementById('trade-amount-preview').style.display = 'none'
  document.getElementById('trade-lookup-hint').textContent = ''
  document.getElementById('add-trade-modal').classList.add('open')
  setTimeout(() => document.getElementById(symbol ? 'trade-shares' : 'trade-symbol').focus(), 50)
}

window.closeAddTradeModal = function() {
  document.getElementById('add-trade-modal').classList.remove('open')
  editingTradeId = null
}

window.openEditTradeModal = function(tradeId) {
  // 從 allTrades 找到這筆交易
  let trade = null
  for (const trades of Object.values(allTrades)) {
    trade = trades.find(t => t.id === tradeId)
    if (trade) break
  }
  if (!trade) return

  editingTradeId = tradeId
  document.getElementById('trade-modal-title').textContent = '編輯交易'
  document.getElementById('trade-symbol').value = trade.symbol
  document.getElementById('trade-symbol').readOnly = true
  document.getElementById('trade-name').value = trade.name
  document.getElementById('trade-type').value = trade.type
  document.getElementById('trade-date').value = trade.date
  document.getElementById('trade-shares').value = trade.shares
  document.getElementById('trade-price').value = trade.price
  document.getElementById('trade-note').value = trade.note ?? ''
  document.getElementById('trade-lookup-hint').textContent = ''
  calcTradeAmount()

  // 設定證券戶
  const acctSelect = document.getElementById('trade-account')
  if (trade.account && [...acctSelect.options].some(o => o.value === trade.account)) {
    acctSelect.value = trade.account
  }

  document.getElementById('add-trade-modal').classList.add('open')
  setTimeout(() => document.getElementById('trade-shares').focus(), 50)
}

window.onSymbolInput = function(raw) {
  const sym = raw.trim().toUpperCase()
  const hint = document.getElementById('trade-lookup-hint')
  const nameInput = document.getElementById('trade-name')

  const inv = allInvestments.find(i => i.symbol === sym)
  if (inv) {
    nameInput.value = inv.name
    document.getElementById('trade-account').value = inv.account
    hint.textContent = ''
    return
  }

  nameInput.value = ''
  clearTimeout(lookupTimer)
  if (sym.length < 4) { hint.textContent = ''; return }

  hint.textContent = '搜尋中…'
  lookupTimer = setTimeout(async () => {
    const res = await api.lookupStock(sym)
    if (res.ok) {
      nameInput.value = res.name
      hint.textContent = `✓ 找到：${res.name}`
      hint.style.color = 'var(--success)'
    } else {
      hint.textContent = '找不到此代號'
      hint.style.color = 'var(--danger)'
    }
  }, 500)
}

window.calcTradeAmount = function() {
  const shares = parseFloat(document.getElementById('trade-shares').value)
  const price = parseFloat(document.getElementById('trade-price').value)
  const preview = document.getElementById('trade-amount-preview')
  if (shares > 0 && price > 0) {
    document.getElementById('trade-amount-value').textContent = 'NT$' + Math.round(shares * price).toLocaleString()
    preview.style.display = 'block'
  } else {
    preview.style.display = 'none'
  }
}

window.saveTrade = async function() {
  const symbol = document.getElementById('trade-symbol').value.trim().toUpperCase()
  const name = document.getElementById('trade-name').value.trim()
  const account = document.getElementById('trade-account').value.trim()
  const type = document.getElementById('trade-type').value
  const date = document.getElementById('trade-date').value
  const shares = parseFloat(document.getElementById('trade-shares').value)
  const price = parseFloat(document.getElementById('trade-price').value)
  const note = document.getElementById('trade-note').value.trim()

  if (!symbol) { toast('請輸入股票代號', 'error'); return }
  if (!name) { toast('請輸入（或等候自動填入）股票名稱', 'error'); return }
  if (!account) { toast('請選擇證券戶', 'error'); return }
  if (!shares || shares <= 0) { toast('請輸入有效股數', 'error'); return }
  if (!price || price <= 0) { toast('請輸入有效成交價', 'error'); return }
  if (!date) { toast('請選擇日期', 'error'); return }

  const res = editingTradeId
    ? await api.updateInvestmentTrade(editingTradeId, { type, shares, price, date, account, note: note || null })
    : await api.addInvestmentTrade({ symbol, name, account, type, shares, price, date, note: note || undefined })
  if (res.ok) {
    closeAddTradeModal()
    toast(`已記錄 ${type} ${symbol} ${shares.toLocaleString()} 股`)
    await loadData()
  } else {
    toast(res.error ?? '新增失敗', 'error')
  }
}

window.deleteTrade = async function(id, symbol) {
  if (!confirm('確定要刪除這筆交易記錄？')) return
  const res = await api.deleteInvestmentTrade(id)
  if (res.ok) {
    toast('已刪除')
    await loadData()
  } else toast(res.error ?? '刪除失敗', 'error')
}

// ── 圖表 ──────────────────────────────────
function renderCharts() {
  renderHoldingChart(allInvestments)
}

function renderHoldingChart(investments) {
  const ctx = document.getElementById('holdingChart').getContext('2d')
  if (holdingChart) holdingChart.destroy()
  const hasValue = investments.some(i => i.market_value > 0)
  if (!hasValue) {
    ctx.canvas.parentElement.innerHTML = '<div class="empty-state">尚無市值資料</div>'
    return
  }
  holdingChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: investments.map(i => i.name),
      datasets: [{ data: investments.map(i => i.market_value), backgroundColor: ['#bc8cff','#ffa657','#e3b341','#ff7eb6','#39d0d8','#d2a8ff','#f0883e','#a5d6ff'], borderWidth: 1, borderColor: '#161b22' }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'right', labels: { color: '#8b949e', font: { size: 11 }, boxWidth: 12 } },
        tooltip: { callbacks: { label: ctx => `${ctx.label}: NT$${ctx.raw.toLocaleString()}` } }
      }
    }
  })
}

async function renderGrowthChart(range) {
  const ctx = document.getElementById('growthChart').getContext('2d')
  if (growthChart) { growthChart.destroy(); growthChart = null }

  // 更新 toggle 按鈕樣式
  ;['week','month','year'].forEach(r => {
    const btn = document.getElementById('btn-range-' + r)
    if (!btn) return
    btn.className = r === range ? 'btn btn-sm' : 'btn btn-sm btn-secondary'
  })

  const res = await api.getInvestmentHistory(range)
  if (!res.ok || !res.data?.length) {
    ctx.canvas.parentElement.innerHTML = '<div class="empty-state">尚無歷史快照<p>在資產總覽頁點「快照」以記錄資產</p></div>'
    return
  }

  const points = res.data
  const labels = points.map(p => {
    const d = new Date(p.snapshot_date)
    return range === 'year'
      ? `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`
      : `${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')}`
  })
  const values = points.map(p => p.total_investments)
  const first = values[0] ?? 0
  const last = values[values.length - 1] ?? 0
  const isUp = last >= first
  const lineColor = isUp ? '#3fb950' : '#f85149'
  const fillColor = isUp ? 'rgba(63,185,80,0.08)' : 'rgba(248,81,73,0.08)'

  growthChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: values,
        borderColor: lineColor,
        backgroundColor: fillColor,
        borderWidth: 2,
        pointRadius: points.length <= 12 ? 3 : 0,
        pointHoverRadius: 5,
        fill: true,
        tension: 0.3,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => 'NT$' + ctx.raw.toLocaleString() } }
      },
      scales: {
        x: { grid: { color: '#30363d' }, ticks: { color: '#8b949e', font: { size: 11 }, maxTicksLimit: 7 } },
        y: {
          grid: { color: '#30363d' },
          ticks: { color: '#8b949e', font: { size: 11 }, callback: v => 'NT$' + (Math.abs(v) >= 10000 ? (v/10000).toFixed(0)+'W' : v.toLocaleString()) }
        }
      },
      interaction: { mode: 'index', intersect: false },
    }
  })
}

window.setGrowthRange = async function(range) {
  currentGrowthRange = range
  await renderGrowthChart(range)
}

window.openUploadModal = function() {
  document.getElementById('csv-status').textContent = ''
  document.getElementById('upload-modal').classList.add('open')
}
window.closeUploadModal = function() { document.getElementById('upload-modal').classList.remove('open') }

document.getElementById('csv-input').addEventListener('change', async function() {
  const file = this.files[0]; if (!file) return
  document.getElementById('csv-status').textContent = '⏳ 上傳中…'
  const formData = new FormData(); formData.append('file', file)
  const res = await api.uploadInvestmentCSV(formData)
  if (res.ok) {
    document.getElementById('csv-status').innerHTML = `<span style="color:var(--success)">✅ 已更新 ${res.updated} 檔</span>`
    setTimeout(() => { closeUploadModal(); loadData() }, 1200)
  } else {
    document.getElementById('csv-status').innerHTML = `<span style="color:var(--danger)">❌ ${res.error}</span>`
  }
})

const zone = document.getElementById('csv-upload-zone')
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover') })
zone.addEventListener('dragleave', () => zone.classList.remove('dragover'))
zone.addEventListener('drop', e => {
  e.preventDefault(); zone.classList.remove('dragover')
  const file = e.dataTransfer.files[0]
  if (file) { const dt = new DataTransfer(); dt.items.add(file); document.getElementById('csv-input').files = dt.files; document.getElementById('csv-input').dispatchEvent(new Event('change')) }
})

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function escJs(s) { return String(s).replace(/'/g,"\\'").replace(/"/g,'\\"') }
