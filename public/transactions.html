<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>消費記錄 — 瑞奇財務</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="瑞奇財務">
<meta name="theme-color" content="#161b22">
<link rel="apple-touch-icon" href="/icons/icon.svg">
<link rel="stylesheet" href="/css/style.css?v=1784541104574">
<style>
/* ── 月曆 ── */
.cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cal-title { font-size:17px; font-weight:600; }
.cal-nav { display:flex; gap:2px; }
.cal-nav button { width:30px; height:30px; border:none; background:none; color:var(--text-muted); font-size:20px; cursor:pointer; border-radius:6px; line-height:1; }
.cal-nav button:hover { color:var(--text); }

.cal-dows { display:grid; grid-template-columns:repeat(7,1fr); }
.cal-dow { font-size:11px; font-weight:500; color:var(--text-muted); padding:4px 0 6px 8px; }
.cal-dow.sat { color:#f85149; }
.cal-dow.sun { color:#f85149; }

.cal-wrap { overflow:hidden; position:relative; }
.cal-strip { display:flex; width:300%; transform:translateX(-33.333%); will-change:transform; }
.cal-grid {
  flex:1; min-width:0;
  display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(6,1fr);
  border-top:1px solid #252c36; border-left:1px solid #252c36;
  height:456px;
}
.cal-cell {
  border-right:1px solid #252c36; border-bottom:1px solid #252c36;
  padding:7px 5px 4px 7px; position:relative; cursor:default; overflow:visible;
}
.cal-cell.clickable { cursor:pointer; }
.cal-cell.net-neg { background:rgba(248,81,73,0.07); }
.cal-cell.net-pos { background:rgba(63,185,80,0.08); }
.cal-cell.today { box-shadow:inset 0 0 0 2px var(--accent); position:relative; z-index:1; }
.cal-cell.selected { box-shadow:inset 0 0 0 2px var(--accent); background:rgba(88,166,255,0.09); position:relative; z-index:1; }
.cal-cell.other-month { opacity:0.3; cursor:default; }

.cal-d { font-size:17px; font-weight:700; line-height:1; color:var(--text); font-variant-numeric:tabular-nums; }
.cal-cell.sat-col .cal-d { color:#f85149; }
.cal-cell.sun-col .cal-d { color:#f85149; }
.cal-cell.today    .cal-d { color:var(--accent); }
.cal-cell.other-month .cal-d { color:var(--text-muted) !important; }

.cal-amts { position:absolute; bottom:4px; right:5px; text-align:right; line-height:1.45; }
.cal-inc { color:#3fb950; font-size:10px; font-weight:600; }
.cal-exp { color:#f85149; font-size:10px; font-weight:600; }

.cal-footer { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding-top:10px; margin-top:2px; border-top:1px solid var(--border); font-size:12px; }
.cf-item { display:flex; align-items:center; gap:5px; }
.cf-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }

/* ── 當日總覽 ── */
.detail-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.detail-hd-title { font-size:15px; font-weight:600; }
.overview-btn { display:flex; align-items:center; gap:4px; background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:5px 10px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; }
.overview-btn:hover { background:var(--surface); }
.overview-btn.active { border-color:var(--accent); color:var(--accent); }

/* ── 定期 tab ── */
.monthly-bar { display:flex; gap:16px; flex-wrap:wrap; padding:12px 16px; background:var(--surface2); border-radius:12px; margin-bottom:18px; }
.monthly-bar-item { display:flex; flex-direction:column; gap:2px; }
.monthly-bar-label { font-size:11px; color:var(--text-muted); }
.monthly-bar-val { font-size:15px; font-weight:700; }

.rec-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.rec-item:last-child { border-bottom:none; }
.rec-item-info { flex:1; min-width:0; }
.rec-item-name { font-weight:600; font-size:14px; }
.rec-item-meta { font-size:12px; color:var(--text-muted); margin-top:2px; }
.rec-meta-sep { display:inline; }
.rec-meta-card { display:inline; }
.rec-item-right { text-align:right; flex-shrink:0; }
.rec-item-amt { font-size:15px; font-weight:700; }
.rec-item-next { font-size:11px; color:var(--text-muted); margin-top:2px; }
.rec-group-hd { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); padding:12px 0 6px; border-bottom:1px solid var(--border); margin-bottom:4px; display:flex; align-items:center; justify-content:space-between; }
@media (max-width:768px) {
  .rec-meta-sep { display:none; }
  .rec-meta-card { display:block; }
}

/* 分類管理 */
.cat-manage-btn { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:14px; padding:2px 6px; border-radius:4px; }
.cat-manage-btn:hover { color:var(--text); }
.cat-item { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border); }
.cat-item:last-child { border-bottom:none; }

@media (max-width: 640px) {
  .cal-cell { padding:5px 3px 3px 5px; }
  .cal-grid { height:282px; }
  .cal-d { font-size:14px; }
  .cal-inc, .cal-exp { font-size:9px; }
  .cal-dow { font-size:10px; padding-left:4px; }
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo"><span>💰</span><span>瑞奇財務</span></div>
  <nav class="sidebar-nav">
    <a href="/" class="nav-item"><span class="icon">🏠</span><span>資產總覽</span></a>
    <a href="/transactions.html" class="nav-item active"><span class="icon">📋</span><span>消費記錄</span></a>
    <a href="/reconcile.html" class="nav-item"><span class="icon">🔍</span><span>帳戶對帳</span></a>
    <a href="/investments.html" class="nav-item"><span class="icon">📈</span><span>投資損益</span></a>
    <a href="/report.html" class="nav-item"><span class="icon">📊</span><span>報表</span></a>
  </nav>
  <button class="sidebar-update-btn" onclick="import('/js/api.js?v=1784541104574').then(m=>m.openUpdateModal())">↑ 更新系統</button>
</aside>

<div class="main">
  <div class="header">
    <h1>消費記錄</h1>
    <div class="header-actions">
      <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ 新增</button>
      <button class="btn btn-secondary btn-sm" onclick="loadMonth()">↻ 重新整理</button>
    </div>
  </div>

  <div class="content">
    <!-- Tab 切換 -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-btn-records" onclick="switchTab('records')">📋 記錄</button>
      <button class="tab-btn" id="tab-btn-recurring" onclick="switchTab('recurring')">🔄 定期</button>
    </div>

    <!-- ── 記錄 Tab ── -->
    <div id="panel-records">
      <div class="card" style="margin-bottom:16px">
        <div class="cal-header">
          <div class="cal-title" id="cal-title" onclick="jumpToToday()" style="cursor:pointer">–</div>
          <div class="cal-nav">
            <button onclick="changeMonth(-1)">‹</button>
            <button onclick="changeMonth(1)">›</button>
          </div>
        </div>
        <div class="cal-dows">
          <div class="cal-dow">週一</div><div class="cal-dow">週二</div>
          <div class="cal-dow">週三</div><div class="cal-dow">週四</div>
          <div class="cal-dow">週五</div>
          <div class="cal-dow sat">週六</div><div class="cal-dow sun">週日</div>
        </div>
        <div class="cal-wrap">
          <div class="cal-strip" id="cal-strip">
            <div id="cal-grid-prev" class="cal-grid"></div>
            <div id="cal-grid" class="cal-grid"></div>
            <div id="cal-grid-next" class="cal-grid"></div>
          </div>
        </div>
        <div class="cal-footer" id="cal-footer"></div>
      </div>

      <div class="card">
        <div class="detail-hd">
          <div class="detail-hd-title" id="detail-title">當日總覽</div>
          <button class="overview-btn" id="overview-btn" onclick="toggleMonthly()">
            總覽 <span id="overview-arrow">▾</span>
          </button>
        </div>
        <div id="daily-view">
          <div class="empty-state" style="padding:20px 0">點選月曆中的日期查看當日記錄</div>
        </div>
        <div id="monthly-view" style="display:none"></div>
      </div>
    </div>

    <!-- ── 定期 Tab ── -->
    <div id="panel-recurring" style="display:none">
      <div class="monthly-bar" id="rec-monthly-bar"></div>
      <div class="card">
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-bottom:16px">
          <button class="btn btn-primary btn-sm" onclick="openRecModal()">+ 新增</button>
        </div>
        <div id="rec-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- 新增/編輯交易 Modal -->
<div class="modal-overlay" id="txn-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">新增支出</div>
      <button class="modal-close" onclick="closeTxnModal()">×</button>
    </div>
    <input type="hidden" id="edit-id">
    <input type="hidden" id="edit-recurring-id">
    <div class="type-toggle">
      <button id="btn-expense" class="active-expense" onclick="setType('支出')">支出</button>
      <button id="btn-income" onclick="setType('收入')">收入</button>
      <button id="btn-transfer-type" onclick="setType('轉帳')">↔ 轉帳</button>
    </div>

    <!-- 支出 / 收入欄位 -->
    <div id="fields-normal">
      <div class="form-group">
        <label class="form-label">日期 *</label>
        <input type="date" id="f-date">
      </div>
      <div class="form-group">
        <label class="form-label" style="display:flex;align-items:center;justify-content:space-between">
          <span>分類</span>
          <button class="cat-manage-btn" onclick="openCatModal()">⚙️</button>
        </label>
        <select id="f-category"></select>
      </div>
      <div class="form-group">
        <label class="form-label">金額 (NT$) *</label>
        <input type="number" id="f-amount" placeholder="0" class="calc-input" oninput="updateNormalTotal()">
      </div>
      <div id="fee-section-normal" style="display:none">
        <div class="form-group" style="margin-bottom:4px">
          <label class="form-label">手續費 (NT$)</label>
          <input type="number" id="f-fee" placeholder="0" class="calc-input" oninput="updateNormalTotal()">
        </div>
        <div id="fee-total-normal" style="font-size:12px;color:var(--text-muted);padding:0 0 8px;font-weight:500"></div>
      </div>
      <button type="button" id="fee-toggle-normal" onclick="toggleFeeSection('normal')" style="background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0 0 10px;font-family:inherit;text-align:left;display:block">＋ 加入手續費</button>
      <div class="form-group">
        <label class="form-label">名稱 <span style="color:var(--text-muted);font-weight:400;font-size:11px">選填</span></label>
        <input type="text" id="f-name" placeholder="例：全家、薪資">
      </div>
      <div class="form-group">
        <label class="form-label">帳戶</label>
        <select id="f-card"></select>
      </div>
      <input type="hidden" id="f-note">
    </div>

    <!-- 轉帳欄位 -->
    <div id="fields-transfer" style="display:none">
      <div style="background:rgba(88,166,255,0.06);border:1px solid rgba(88,166,255,0.2);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--text-muted)">
        同時建立兩筆關聯記錄：來源帳戶的支出 + 目標帳戶的收入
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">來源帳戶 *</label>
          <select id="f-xfr-from"></select>
        </div>
        <div class="form-group">
          <label class="form-label">目標帳戶 *</label>
          <select id="f-xfr-to"></select>
        </div>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">金額 (NT$) *</label>
          <input type="number" id="f-xfr-amount" placeholder="0" class="calc-input">
        </div>
        <div class="form-group">
          <label class="form-label">日期 *</label>
          <input type="date" id="f-xfr-date">
        </div>
      </div>
      <div id="fee-section-transfer" style="display:none">
        <div class="form-group" style="margin-bottom:4px">
          <label class="form-label">手續費 (NT$) <span style="color:var(--text-muted);font-weight:400;font-size:11px">從來源帳戶額外扣除</span></label>
          <input type="number" id="f-xfr-fee" placeholder="0" class="calc-input">
        </div>
      </div>
      <button type="button" id="fee-toggle-transfer" onclick="toggleFeeSection('transfer')" style="background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0 0 10px;font-family:inherit;text-align:left;display:block">＋ 加入手續費</button>
      <div class="form-group">
        <label class="form-label">備註</label>
        <input type="text" id="f-xfr-note" placeholder="選填">
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-danger" id="modal-delete-btn" style="display:none;margin-right:auto" onclick="deleteFromModal()">刪除</button>
      <button class="btn btn-secondary" onclick="closeTxnModal()">取消</button>
      <button class="btn btn-primary" onclick="saveTxn()">儲存</button>
    </div>
  </div>
</div>

<!-- 定期紀錄詳細 Modal -->
<div class="modal-overlay" id="rec-detail-modal">
  <div class="modal" style="max-width:480px;max-height:82vh;display:flex;flex-direction:column">
    <div class="modal-header" style="flex-shrink:0;align-items:flex-start">
      <div style="flex:1;min-width:0">
        <div class="modal-title" id="rcd-name"></div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px" id="rcd-meta"></div>
      </div>
      <div style="text-align:right;flex-shrink:0;margin-left:12px">
        <div id="rcd-total" style="font-size:18px;font-weight:700"></div>
        <div style="font-size:11px;color:var(--text-muted);margin-top:1px" id="rcd-total-label"></div>
      </div>
      <button class="modal-close" onclick="document.getElementById('rec-detail-modal').classList.remove('open')" style="margin-left:12px">×</button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:0 20px 8px" id="rcd-list"></div>
    <div style="flex-shrink:0;padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <button class="btn btn-secondary btn-sm" id="rcd-terminate-btn" style="color:var(--danger);border-color:var(--danger);display:none" onclick="terminateRecDetail()">終止定期</button>
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('rec-detail-modal').classList.remove('open')">關閉</button>
    </div>
  </div>
</div>

<!-- 定期刪除範圍 Modal -->
<div class="modal-overlay" id="rec-delete-scope-modal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <div class="modal-title">刪除定期項目</div>
      <button class="modal-close" onclick="document.getElementById('rec-delete-scope-modal').classList.remove('open')">×</button>
    </div>
    <div style="padding:4px 0 8px">
      <button onclick="doDeleteRec('this')" style="display:block;width:100%;text-align:left;padding:16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer;color:var(--text)">
        <div style="font-weight:600;font-size:14px;margin-bottom:4px">刪除此紀錄</div>
        <div style="font-size:12px;color:var(--text-muted)">只刪除此定期設定，歷史交易紀錄完整保留</div>
      </button>
      <button onclick="doDeleteRec('terminate')" style="display:block;width:100%;text-align:left;padding:16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;cursor:pointer;color:var(--text)">
        <div style="font-weight:600;font-size:14px;margin-bottom:4px;color:var(--danger)">終止未來週期</div>
        <div style="font-size:12px;color:var(--text-muted)">刪除此設定及所有尚未確認的待確認交易，歷史已對帳紀錄保留</div>
      </button>
    </div>
  </div>
</div>

<!-- 定期修改範圍 Modal -->
<div class="modal-overlay" id="scope-modal">
  <div class="modal" style="max-width:340px">
    <div class="modal-header">
      <div class="modal-title">修改定期紀錄</div>
      <button class="modal-close" onclick="document.getElementById('scope-modal').classList.remove('open')">×</button>
    </div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:16px" id="scope-txn-name"></div>
    <div style="display:flex;flex-direction:column;gap:10px;padding-bottom:4px">
      <button class="btn btn-secondary" style="width:100%;text-align:left;padding:12px 14px" onclick="pickScope('this')">
        <div style="font-weight:600;margin-bottom:2px">修改此記錄</div>
        <div style="font-size:12px;color:var(--text-muted)">只更動這一筆，不影響其他</div>
      </button>
      <button class="btn btn-secondary" style="width:100%;text-align:left;padding:12px 14px" onclick="pickScope('future')">
        <div style="font-weight:600;margin-bottom:2px">修改連同未來週期</div>
        <div style="font-size:12px;color:var(--text-muted)">這筆及之後同週期的紀錄一起更新</div>
      </button>
    </div>
  </div>
</div>

<!-- 轉帳 Modal -->
<div class="modal-overlay" id="transfer-modal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <div class="modal-title">↔ 帳戶轉帳</div>
      <button class="modal-close" onclick="closeTransferModal()">×</button>
    </div>
    <div style="background:rgba(88,166,255,0.06);border:1px solid rgba(88,166,255,0.2);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:12px;color:var(--text-muted)">
      轉帳會同時建立兩筆關聯記錄：來源帳戶的支出和目標帳戶的收入。
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">來源帳戶 *</label>
        <select id="xfr-from"></select>
      </div>
      <div class="form-group">
        <label class="form-label">目標帳戶 *</label>
        <select id="xfr-to"></select>
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label class="form-label">金額 (NT$) *</label>
        <input type="number" id="xfr-amount" placeholder="0" class="calc-input">
      </div>
      <div class="form-group">
        <label class="form-label">日期 *</label>
        <input type="date" id="xfr-date">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">備註</label>
      <input type="text" id="xfr-note" placeholder="選填">
    </div>
    <input type="hidden" id="edit-transfer-id">
    <input type="hidden" id="edit-transfer-txn-id">
    <div class="modal-footer">
      <button class="btn btn-danger" id="xfr-delete-btn" style="display:none;margin-right:auto" onclick="deleteTransfer()">刪除</button>
      <button class="btn btn-secondary" onclick="closeTransferModal()">取消</button>
      <button class="btn btn-primary" id="xfr-save-btn" onclick="saveTransfer()">建立轉帳</button>
    </div>
  </div>
</div>

<!-- 分類管理 Modal -->
<div class="modal-overlay" id="cat-modal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <div class="modal-title">管理分類</div>
      <button class="modal-close" onclick="closeCatModal()">×</button>
    </div>
    <div id="cat-list" style="margin-bottom:16px;max-height:280px;overflow-y:auto"></div>
    <button onclick="fixCategoryRecords()" style="width:100%;background:none;border:1px dashed var(--border);color:var(--text-muted);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;font-family:inherit;margin-bottom:12px">🔧 修復舊紀錄（同步分類名稱）</button>
    <div style="background:var(--surface2);border-radius:8px;padding:10px;margin-bottom:8px">
      <div style="font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:6px">新增支出分類</div>
      <div style="display:flex;gap:8px">
        <input type="text" id="new-expense-cat" placeholder="分類名稱" style="flex:1">
        <button class="btn btn-secondary btn-sm" onclick="addCategory('支出')">新增</button>
      </div>
    </div>
    <div style="background:var(--surface2);border-radius:8px;padding:10px">
      <div style="font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:6px">新增收入分類</div>
      <div style="display:flex;gap:8px">
        <input type="text" id="new-income-cat" placeholder="分類名稱" style="flex:1">

<script src="/js/calc-keyboard.js?v=1784541104574"></script>
<script type="module">
import { api, toast, formatMoney, fmtSigned, amtColor, badgeHtml, catIconHtml, catIcon, freqLabel, initAppName, swr } from '/js/api.js?v=1784541104574'
import { openAddTxnModal, preloadTxnModalData } from '/js/txn-modal.js?v=1784541104574'

// 用已存的 icon 欄位 fallback 到 CAT_ICON_MAP
function resolvedCatIcon(categoryName) {
  const cat = allCategories.find(c => c.name === categoryName)
  return (cat && cat.icon) ? cat.icon : catIcon(categoryName)
}
// 分類 icon 圓圈（供 daily view 使用）
function resolvedCatIconHtml(categoryName, size = 36) {
  const icon = resolvedCatIcon(categoryName)
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.5)}px;flex-shrink:0">${icon}</div>`
}
// 分類 icon 純 emoji（供 table cell 使用，不含圓圈背景）
function catEmojiTag(categoryName) {
  return `<span style="font-size:16px;flex-shrink:0;line-height:1">${resolvedCatIcon(categoryName)}</span>`
}

// ── State ──
let allCategories = [], allAccounts = [], currentType = '支出'
let selectedDate = '', currentMonth = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' }).slice(0, 7)
let showMonthly = false, cachedTxns = []
let recItems = [], recType = '支出'
let currentTab = 'records'
const today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' })

async function init() {
  // 先套用 meta 快取，讓 select 立刻有內容
  const cachedCats = swr.get('categories')
  const cachedAccts = swr.get('accounts')
  if (cachedCats) { allCategories = cachedCats; renderCategorySelects() }
  if (cachedAccts) { allAccounts = cachedAccts; renderAccountSelects(); renderXfrSelects() }

  // 全部並行跑，不等 meta
  await Promise.all([loadMeta(), loadMonth(), loadRecurring()])
  // 自動選今天
  selectedDate = today
  renderCalendar(currentMonth, rebuildByDate())
  const todayTxns = cachedTxns.filter(t => t.date === today)
  if (todayTxns.length) renderDailyView(todayTxns)
  const [,mm,dd] = today.split('-')
  document.getElementById('detail-title').textContent = `${parseInt(mm)} 月 ${parseInt(dd)} 日`
}

async function loadMeta() {
  const [cr, ar] = await Promise.all([api.getCategories(), api.getAssets()])
  if (cr.ok) { allCategories = cr.data; swr.set('categories', cr.data); renderCategorySelects() }
  if (ar.ok) { allAccounts = ar.data.accounts ?? []; swr.set('accounts', ar.data.accounts ?? []); renderAccountSelects(); renderXfrSelects() }
  preloadTxnModalData(allAccounts, allCategories)
}

// ── Tab 切換 ──
window.switchTab = function(tab) {
  currentTab = tab
  document.getElementById('panel-records').style.display = tab === 'records' ? 'block' : 'none'
  document.getElementById('panel-recurring').style.display = tab === 'recurring' ? 'block' : 'none'
  document.getElementById('tab-btn-records').classList.toggle('active', tab === 'records')
  document.getElementById('tab-btn-recurring').classList.toggle('active', tab === 'recurring')
}

// ── 月曆 ──
function applyMonthData() {
  const realTxns = cachedTxns.filter(t => !t.transfer_id)
  const expTotal = realTxns.filter(t => t.type !== '收入').reduce((s,t) => s+t.amount, 0)
  const incTotal = realTxns.filter(t => t.type === '收入').reduce((s,t) => s+t.amount, 0)
  const netSigned = incTotal - expTotal

  const byDate = {}
  for (const t of realTxns) {
    if (!byDate[t.date]) byDate[t.date] = { income:0, expense:0 }
    if (t.type === '收入') byDate[t.date].income += t.amount
    else byDate[t.date].expense += t.amount
  }

  renderCalendar(currentMonth, byDate)

  document.getElementById('cal-footer').innerHTML = `
    <div class="cf-item"><span class="cf-dot" style="background:#f85149"></span>支出
      <b style="color:#f85149">$${expTotal.toLocaleString()}</b></div>
    <div class="cf-item"><span class="cf-dot" style="background:#3fb950"></span>收入
      <b style="color:#3fb950">$${incTotal.toLocaleString()}</b></div>
    <div class="cf-item"><span class="cf-dot" style="background:${netSigned>=0?'#3fb950':'#f85149'}"></span>總計
      <b style="color:${netSigned>=0?'#3fb950':'#f85149'}">$${Math.abs(netSigned).toLocaleString()}</b></div>
  `

  if (showMonthly) renderMonthlyTable()
  else if (selectedDate) renderDailyView(cachedTxns.filter(t => t.date === selectedDate))
}

async function loadMonth() {
  const cacheKey = `txns-${currentMonth}`
  const cached = swr.get(cacheKey)
  if (cached) {
    cachedTxns = cached
    applyMonthData()
  }

  const res = await api.getTransactions({ month: currentMonth, limit: 500 })
  if (!res.ok) return
  swr.set(cacheKey, res.data)
  cachedTxns = res.data
  applyMonthData()
}

function fmtAmt(n) {
  if (n >= 10000) return Math.round(n/1000) + 'k'
  return n.toLocaleString()
}

function renderCalendar(month, byDate) {
  const [year, mon] = month.split('-').map(Number)
  const firstDow = new Date(year, mon-1, 1).getDay()
  const offset = firstDow === 0 ? 6 : firstDow - 1
  const daysInMonth = new Date(year, mon, 0).getDate()
  const prevDays = new Date(year, mon-1, 0).getDate()

  const [y, m] = currentMonth.split('-').map(Number)
  document.getElementById('cal-title').textContent = `${y} 年 ${m} 月`

  let html = ''
  for (let i = offset-1; i >= 0; i--) {
    html += cellHtml(String(prevDays-i).padStart(2,'0'), null, 'other-month', (offset-1-i)%7, null)
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(mon).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const colIdx = (offset + d - 1) % 7
    const data = byDate[dateStr] || null
    const cls = []
    if (data) {
      const net = (data.income || 0) - (data.expense || 0)
      if (net > 0) cls.push('net-pos')
      else if (net < 0) cls.push('net-neg')
    }
    if (dateStr === today && selectedDate === today) cls.push('today')
    if (dateStr === selectedDate) cls.push('selected')
    if (data) cls.push('clickable')
    html += cellHtml(String(d).padStart(2,'0'), dateStr, cls.join(' '), colIdx, data)
  }
  const total = offset + daysInMonth
  const tail = total % 7 === 0 ? 0 : 7 - (total % 7)
  const rows = Math.ceil((total + tail) / 7)
  const extraRows = 6 - rows
  const fillEnd = tail + extraRows * 7
  for (let i = 1; i <= fillEnd; i++) {
    html += cellHtml(String(i).padStart(2,'0'), null, 'other-month', (offset+daysInMonth-1+i)%7, null)
  }
  document.getElementById('cal-grid').innerHTML = html
  updateAdjacentGrids()
}

function renderCalendarShell(month, el) {
  const [year, mon] = month.split('-').map(Number)
  const firstDow = new Date(year, mon-1, 1).getDay()
  const offset = firstDow === 0 ? 6 : firstDow - 1
  const daysInMonth = new Date(year, mon, 0).getDate()
  const prevDays = new Date(year, mon-1, 0).getDate()
  let html = ''
  for (let i = offset-1; i >= 0; i--) {
    const c = (offset-1-i)%7; html += `<div class="cal-cell other-month${c===5?' sat-col':c===6?' sun-col':''}"><div class="cal-d">${String(prevDays-i).padStart(2,'0')}</div></div>`
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const c = (offset+d-1)%7; html += `<div class="cal-cell${c===5?' sat-col':c===6?' sun-col':''}"><div class="cal-d">${String(d).padStart(2,'0')}</div></div>`
  }
  const tail = (offset+daysInMonth)%7
  for (let i = 1; i < (tail===0?0:8-tail); i++) {
    const c = (offset+daysInMonth-1+i)%7; html += `<div class="cal-cell other-month${c===5?' sat-col':c===6?' sun-col':''}"><div class="cal-d">${String(i).padStart(2,'0')}</div></div>`
  }
  el.innerHTML = html
}

function updateAdjacentGrids() {
  const [y, m] = currentMonth.split('-').map(Number)
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
  renderCalendarShell(fmt(new Date(y, m-2, 1)), document.getElementById('cal-grid-prev'))
  renderCalendarShell(fmt(new Date(y, m, 1)),   document.getElementById('cal-grid-next'))
}

function cellHtml(label, dateStr, extraCls, colIdx, data) {
  const isSat = colIdx===5, isSun = colIdx===6
  const colCls = isSat ? 'sat-col' : isSun ? 'sun-col' : ''
  const clickAttr = dateStr ? `onclick="selectDay('${dateStr}')"` : ''
  const dblClickAttr = dateStr ? `ondblclick="openAddModal('${dateStr}')"` : ''
  let amtsHtml = ''
  if (data) {
    let lines = ''
    if (data.income > 0)  lines += `<div class="cal-inc">${fmtAmt(data.income)}</div>`
    if (data.expense > 0) lines += `<div class="cal-exp">${fmtAmt(data.expense)}</div>`
    if (lines) amtsHtml = `<div class="cal-amts">${lines}</div>`
  }
  return `<div class="cal-cell ${extraCls} ${colCls}" ${clickAttr} ${dblClickAttr}><div class="cal-d">${label}</div>${amtsHtml}</div>`
}

window.jumpToToday = async function() {
  const thisMonth = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' }).slice(0, 7)
  if (currentMonth === thisMonth && selectedDate === today && !showMonthly) return
  currentMonth = thisMonth
  showMonthly = false
  syncToggleBtn()
  await loadMonth()
  selectedDate = today
  renderCalendar(currentMonth, rebuildByDate())
  const txns = cachedTxns.filter(t => t.date === today)
  if (txns.length) renderDailyView(txns)
  else resetDetailView()
  const [,mm,dd] = today.split('-')
  document.getElementById('detail-title').textContent = `${parseInt(mm)} 月 ${parseInt(dd)} 日`
}

window.changeMonth = async function(dir) {
  const [y, m] = currentMonth.split('-').map(Number)
  const d = new Date(y, m-1+dir, 1)
  currentMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
  if (!showMonthly) {
    const thisMonth = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' }).slice(0, 7)
    selectedDate = currentMonth === thisMonth ? today : `${currentMonth}-01`
  }
  // 先用 cache 立刻渲染（cachedTxns 先清空避免顯示舊月資料）
  const cacheKey = `txns-${currentMonth}`
  const cached = swr.get(cacheKey)
  cachedTxns = cached || []
  if (showMonthly) {
    renderCalendar(currentMonth, rebuildByDate())
    const [y,m] = currentMonth.split('-').map(Number)
    document.getElementById('detail-title').textContent = `${y} 年 ${m} 月`
    renderMonthlyTable()
  } else {
    renderCalendar(currentMonth, rebuildByDate())
    const txns = cachedTxns.filter(t => t.date === selectedDate)
    resetDetailView()
    if (txns.length) renderDailyView(txns)
    const [,mm,dd] = selectedDate.split('-')
    document.getElementById('detail-title').textContent = `${parseInt(mm)} 月 ${parseInt(dd)} 日`
  }
  // 背景更新資料
  loadMonth()
}

// 月曆 strip 拖曳（3 格橫排，跟手指即時移動）
;(function () {
  const EDGE = 30, COMMIT = 70
  let sx = 0, sy = 0, dx = 0, intent = null, active = false, animating = false

  const wrap = document.querySelector('.cal-wrap')
  const strip = document.getElementById('cal-strip')
  if (!wrap || !strip) return

  function setStrip(dxPx, animate) {
    strip.style.transition = animate ? 'transform 0.25s cubic-bezier(0.4,0,0.2,1)' : 'none'
    strip.style.transform = dxPx === 0
      ? 'translateX(-33.333%)'
      : `translateX(calc(-33.333% + ${dxPx}px))`
  }

  function onStart(clientX, clientY) {
    if (animating) return
    sx = clientX; sy = clientY
    dx = 0; intent = null; active = true
  }
  function onMove(clientX, clientY, preventDefault) {
    if (!active || animating) return
    const cdx = clientX - sx
    const cdy = clientY - sy
    if (!intent && (Math.abs(cdx) > 5 || Math.abs(cdy) > 5)) {
      intent = Math.abs(cdx) > Math.abs(cdy) ? 'h' : 'v'
    }
    if (intent !== 'h') return
    if (preventDefault) preventDefault()
    dx = cdx
    setStrip(dx, false)
  }
  function onEnd() {
    if (!active) return
    active = false
    if (intent !== 'h') return
    if (Math.abs(dx) >= COMMIT) {
      animating = true
      const dir = dx < 0 ? 1 : -1
      strip.style.transition = 'transform 0.22s cubic-bezier(0.4,0,0.2,1)'
      strip.style.transform = dir > 0 ? 'translateX(-66.666%)' : 'translateX(0%)'
      const [y, m] = currentMonth.split('-').map(Number)
      const nd = new Date(y, m - 1 + dir, 1)
      const newMonth = `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`
      setTimeout(async () => {
        strip.style.transition = 'none'
        renderCalendarShell(newMonth, document.getElementById('cal-grid'))
        strip.style.transform = 'translateX(-33.333%)'
        await changeMonth(dir)
        animating = false
      }, 230)
    } else {
      setStrip(0, true)
    }
  }

  // touch
  wrap.addEventListener('touchstart', e => onStart(e.touches[0].clientX, e.touches[0].clientY), { passive: true })
  wrap.addEventListener('touchmove', e => onMove(e.touches[0].clientX, e.touches[0].clientY, () => e.preventDefault()), { passive: false })
  wrap.addEventListener('touchend', onEnd, { passive: true })

  // mouse
  wrap.addEventListener('mousedown', e => { onStart(e.clientX, e.clientY); wrap.style.userSelect = 'none' })
  window.addEventListener('mousemove', e => { if (active) onMove(e.clientX, e.clientY, null) })
  window.addEventListener('mouseup', () => { wrap.style.userSelect = ''; onEnd() })
})()

window.selectDay = async function(date) {
  if (selectedDate === date) {
    selectedDate = ''; resetDetailView(); renderCalendar(currentMonth, rebuildByDate()); return
  }
  selectedDate = date
  renderCalendar(currentMonth, rebuildByDate())
  if (showMonthly) { showMonthly = false; syncToggleBtn() }
  renderDailyView(cachedTxns.filter(t => t.date === date))
  const [,mm,dd] = date.split('-')
  document.getElementById('detail-title').textContent = `${parseInt(mm)} 月 ${parseInt(dd)} 日`
}

function rebuildByDate() {
  const m = {}
  for (const t of cachedTxns) {
    if (t.transfer_id) continue
    if (!m[t.date]) m[t.date] = { income:0, expense:0 }
    if (t.type === '收入') m[t.date].income += t.amount
    else m[t.date].expense += t.amount
  }
  return m
}

// ── 合併轉帳配對 ──
function mergeTransferPairs(txns) {
  const result = []
  const seen = new Set()
  for (const t of txns) {
    if (t.transfer_id) {
      if (seen.has(t.transfer_id)) continue
      seen.add(t.transfer_id)
      const out = txns.find(x => x.transfer_id === t.transfer_id && x.type === '支出') || t
      const inc = txns.find(x => x.transfer_id === t.transfer_id && x.type === '收入') || t
      result.push({ ...out, _isMergedTransfer: true, _xfrFrom: out.card, _xfrTo: inc.card })
    } else {
      result.push(t)
    }
  }
  return result
}

// ── 當日總覽 ──
function renderDailyView(txns) {
  document.getElementById('daily-view').style.display = 'block'
  document.getElementById('monthly-view').style.display = 'none'
  const el = document.getElementById('daily-view')
  if (!txns.length) { el.innerHTML = '<div class="empty-state" style="padding:20px 0">當日無記錄</div>'; return }

  const realTxns = txns.filter(t => !t.transfer_id)
  const expTotal = realTxns.filter(t => t.type !== '收入').reduce((s,t) => s+t.amount, 0)
  const incTotal = realTxns.filter(t => t.type === '收入').reduce((s,t) => s+t.amount, 0)

  let html = mergeTransferPairs(txns).map(t => {
    if (t._isMergedTransfer) {
      const icon = `<div style="width:38px;height:38px;border-radius:50%;background:rgba(208,112,48,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">↔</div>`
      return `<div class="txn-row" onclick="if(window.innerWidth<=768)editTransfer('${t.transfer_id}')">
        ${icon}
        <div class="txn-info">
          <div class="txn-name">${escHtml(t.note || '轉帳')}</div>
          <div class="txn-meta">${escHtml(t._xfrFrom)} → ${escHtml(t._xfrTo)}</div>
        </div>
        <div class="txn-right">
          <span class="txn-amt" style="color:#d07030">NT$${t.amount.toLocaleString()}</span>
          <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();editTransfer('${t.transfer_id}')">編輯</button>
          <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteTxn('${t.id}',true)">刪</button>
        </div>
      </div>`
    }
    const editAttrs = `'${t.id}','${escJs(t.name)}',${t.amount},'${t.date}','${escJs(t.category)}','${escJs(t.card||'')}','${escJs(t.note||'')}','${escJs(t.type||'支出')}','${escJs(t.recurring_id||'')}'`
    const recBadge = t.source === '定期' ? ' <span title="定期項目" style="font-size:13px">🔁</span>' : ''
    return `<div class="txn-row" onclick="if(window.innerWidth<=768)editTxn(${editAttrs})">
      ${resolvedCatIconHtml(t.category, 38)}
      <div class="txn-info">
        <div class="txn-name">${escHtml(t.name || t.category)}${recBadge}</div>
        <div class="txn-meta">${t.card?escHtml(t.card):''}</div>
      </div>
      <div class="txn-right">
        <span class="txn-amt ${t.type==='收入'?'amt-inc':'amt-exp'}">${fmtSigned(t.amount,t.type)}</span>
        <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();editTxn(${editAttrs})">編輯</button>
        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteTxn('${t.id}',false)">刪</button>
      </div>
    </div>`
  }).join('')

  const realCount = txns.filter(t => !t.transfer_id).length
  if (realCount >= 1) {
    const parts = []
    if (incTotal > 0) parts.push(`<span style="color:#3fb950">收入 $${incTotal.toLocaleString()}</span>`)
    if (expTotal > 0) parts.push(`<span style="color:#f85149">支出 $${expTotal.toLocaleString()}</span>`)
    if (parts.length) html += `<div class="daily-summary" style="display:flex;justify-content:flex-end;gap:14px;padding:6px 0 2px;padding-right:92px;font-size:13px;font-weight:600">${parts.join('')}</div>`
  }
  el.innerHTML = html
}

function resetDetailView() {
  document.getElementById('detail-title').textContent = '當日總覽'
  document.getElementById('daily-view').innerHTML = '<div class="empty-state" style="padding:20px 0">點選月曆中的日期查看當日記錄</div>'
}

// ── 整月 toggle ──
window.toggleMonthly = function() {
  showMonthly = !showMonthly
  syncToggleBtn()
  if (showMonthly) {
    document.getElementById('daily-view').style.display = 'none'
    document.getElementById('monthly-view').style.display = 'block'
    selectedDate = ''
    document.querySelectorAll('#cal-grid .cal-cell.selected, #cal-grid .cal-cell.today').forEach(el => el.classList.remove('selected', 'today'))
    const [y,m] = currentMonth.split('-').map(Number)
    document.getElementById('detail-title').textContent = `${y} 年 ${m} 月`
    renderMonthlyTable()
  } else {
    document.getElementById('monthly-view').style.display = 'none'
    document.getElementById('daily-view').style.display = 'block'
    const thisMonth = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Taipei' }).slice(0, 7)
    selectedDate = currentMonth === thisMonth ? today : `${currentMonth}-01`
    renderCalendar(currentMonth, rebuildByDate())
    const txns = cachedTxns.filter(t => t.date === selectedDate)
    if (txns.length) renderDailyView(txns)
    else resetDetailView()
    const [,mm,dd] = selectedDate.split('-')
    document.getElementById('detail-title').textContent = `${parseInt(mm)} 月 ${parseInt(dd)} 日`
  }
}

function renderMonthlyTable() {
  const container = document.getElementById('monthly-view')
  if (!cachedTxns.length) {
    container.innerHTML = '<div class="empty-state" style="padding:20px 0">本月無記錄</div>'
    return
  }
  const sorted = [...cachedTxns].sort((a,b) => b.date.localeCompare(a.date) || b.created_at.localeCompare(a.created_at))

  // 按日期分組
  const dateGroups = []
  const seen = {}
  for (const t of sorted) {
    if (!seen[t.date]) { seen[t.date] = []; dateGroups.push({ date: t.date, txns: seen[t.date] }) }
    seen[t.date].push(t)
  }

  let html = ''
  for (const { date, txns } of dateGroups) {
    const [,mm,dd] = date.split('-')
    const expTotal = txns.filter(t => t.type !== '收入' && !t.transfer_id).reduce((s,t) => s+t.amount, 0)
    const incTotal = txns.filter(t => t.type === '收入' && !t.transfer_id).reduce((s,t) => s+t.amount, 0)

    html += `<div style="font-size:13px;font-weight:600;padding:14px 0 6px;color:var(--text-muted);border-top:1px solid var(--border);margin-top:4px">${parseInt(mm)} 月 ${parseInt(dd)} 日</div>`
    html += mergeTransferPairs(txns).map(t => {
      if (t._isMergedTransfer) {
        const icon = `<div style="width:38px;height:38px;border-radius:50%;background:rgba(208,112,48,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">↔</div>`
        return `<div class="txn-row" onclick="if(window.innerWidth<=768)editTransfer('${t.transfer_id}')">
          ${icon}
          <div class="txn-info">
            <div class="txn-name">${escHtml(t.note || '轉帳')}</div>
            <div class="txn-meta">${escHtml(t._xfrFrom)} → ${escHtml(t._xfrTo)}</div>
          </div>
          <div class="txn-right">
            <span class="txn-amt" style="color:#d07030">NT$${t.amount.toLocaleString()}</span>
            <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();editTransfer('${t.transfer_id}')">編輯</button>
            <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteTxn('${t.id}',true)">刪</button>
          </div>
        </div>`
      }
      const editAttrs = `'${t.id}','${escJs(t.name)}',${t.amount},'${t.date}','${escJs(t.category)}','${escJs(t.card||'')}','${escJs(t.note||'')}','${escJs(t.type||'支出')}','${escJs(t.recurring_id||'')}'`
      const recBadge = t.source === '定期' ? ' <span title="定期項目" style="font-size:13px">🔁</span>' : ''
      return `<div class="txn-row" onclick="if(window.innerWidth<=768)editTxn(${editAttrs})">
        ${resolvedCatIconHtml(t.category, 38)}
        <div class="txn-info">
          <div class="txn-name">${escHtml(t.name || t.category)}${recBadge}</div>
          <div class="txn-meta">${t.card?escHtml(t.card):''}</div>
        </div>
        <div class="txn-right">
          <span class="txn-amt ${t.type==='收入'?'amt-inc':'amt-exp'}">${fmtSigned(t.amount,t.type)}</span>
          <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();editTxn(${editAttrs})">編輯</button>
          <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteTxn('${t.id}',false)">刪</button>
        </div>
      </div>`
    }).join('')

    const dayRealCount = txns.filter(t => !t.transfer_id).length
    if (dayRealCount >= 1) {
      const parts = []
      if (incTotal > 0) parts.push(`<span style="color:#3fb950">收入 $${incTotal.toLocaleString()}</span>`)
      if (expTotal > 0) parts.push(`<span style="color:#f85149">支出 $${expTotal.toLocaleString()}</span>`)
      if (parts.length) html += `<div class="daily-summary" style="display:flex;justify-content:flex-end;gap:14px;padding:6px 0 2px;padding-right:92px;font-size:13px;font-weight:600">${parts.join('')}</div>`
    }
  }
  container.innerHTML = html
}

const ACCT_TYPE_ORDER = ['銀行', '銀行存款', '證券戶', '投資帳戶', '信用卡', '現金']
const ACCT_TYPE_LABEL = { '銀行': '銀行', '銀行存款': '銀行', '證券戶': '證券戶', '投資帳戶': '證券戶', '信用卡': '信用卡', '現金': '現金' }

function groupedAccountOptions(accounts, withEmpty = false) {
  const groups = {}
  for (const a of accounts) {
    const label = ACCT_TYPE_LABEL[a.type] ?? a.type
    if (!groups[label]) groups[label] = []
    groups[label].push(a)
  }
  const order = ['銀行', '證券戶', '信用卡', '現金']
  let html = withEmpty ? '<option value="">全部帳戶</option>' : ''
  for (const type of order) {
    if (!groups[type]?.length) continue
    html += `<optgroup label="${type}">`
    html += groups[type].map(a => `<option value="${escHtml(a.name)}">${escHtml(a.name)}</option>`).join('')
    html += '</optgroup>'
  }
  // 其他未分類
  const knownTypes = new Set(order)
  const others = accounts.filter(a => !knownTypes.has(ACCT_TYPE_LABEL[a.type] ?? a.type))
  if (others.length) {
    html += `<optgroup label="其他">`
    html += others.map(a => `<option value="${escHtml(a.name)}">${escHtml(a.name)}</option>`).join('')
    html += '</optgroup>'
  }
  return html
}

function _openTxnEditForm({ id, name, amount, date, category, card, note, type, recurringId } = {}) {
  // 從 note 反解手續費
  const feeMatch = note ? note.match(/含手續費\s*NT\$([0-9,]+)/) : null
  const fee = feeMatch ? parseInt(feeMatch[1].replace(/,/g, '')) : 0
  const baseAmount = fee > 0 ? amount - fee : amount

  document.getElementById('edit-id').value = id
  document.getElementById('edit-recurring-id').value = recurringId || ''
  document.getElementById('f-name').value = name
  document.getElementById('f-amount').value = baseAmount
  document.getElementById('f-fee').value = fee || ''
  const feeSection = document.getElementById('fee-section-normal')
  feeSection.style.display = fee > 0 ? 'block' : 'none'
  document.getElementById('fee-toggle-normal').textContent = fee > 0 ? '－ 移除手續費' : '＋ 加入手續費'
  document.getElementById('f-date').value = date
  document.getElementById('f-note').value = note || ''
  setType(type || '支出')
  updateNormalTotal()
  const cs = document.getElementById('f-category')
  for (let i=0;i<cs.options.length;i++) if(cs.options[i].value===category){cs.selectedIndex=i;break}
  const as = document.getElementById('f-card')
  for (let i=0;i<as.options.length;i++) if(as.options[i].value===card){as.selectedIndex=i;break}
  const delBtn = document.getElementById('modal-delete-btn')
  delBtn.style.display = ''
  delBtn.dataset.id = id
  delBtn.dataset.isTransfer = 'false'
  document.getElementById('txn-modal').classList.add('open')
}

window.saveTxn = async function() {
  const id = document.getElementById('edit-id').value

  // 轉帳走獨立流程
  if (currentType === '轉帳') {
    const from_account = document.getElementById('f-xfr-from').value
    const to_account = document.getElementById('f-xfr-to').value
    const amount = parseInt(document.getElementById('f-xfr-amount').value)
    const date = document.getElementById('f-xfr-date').value
    const note = document.getElementById('f-xfr-note').value.trim() || null
    const fee = parseInt(document.getElementById('f-xfr-fee').value) || 0
    if (!amount || !date) { toast('請填寫金額和日期', 'error'); return }
    if (from_account === to_account) { toast('來源與目標帳戶不能相同', 'error'); return }
    const res = await api.addTransfer({ from_account, to_account, amount, date, note, fee })
    if (res.ok) {
      closeTxnModal(); toast(fee > 0 ? `轉帳記錄已建立，手續費 NT$${fee.toLocaleString()} 另計` : '轉帳記錄已建立')
      await loadMonth()
      if (selectedDate) renderDailyView(cachedTxns.filter(t => t.date === selectedDate))
      if (showMonthly) renderMonthlyTable()
    } else toast(res.error ?? '轉帳失敗', 'error')
    return
  }

  const category = document.getElementById('f-category').value
  const baseAmount = parseInt(document.getElementById('f-amount').value)
  const fee = parseInt(document.getElementById('f-fee').value) || 0
  const data = {
    name: document.getElementById('f-name').value.trim(),
    amount: baseAmount + fee,
    date: document.getElementById('f-date').value,
    category,
    card: document.getElementById('f-card').value,
    type: currentType,
    note: fee > 0 ? `含手續費 NT$${fee.toLocaleString()}` : null,
  }
  if (!data.amount || !data.date) { toast('請填寫金額和日期', 'error'); return }
  const recurringId = document.getElementById('edit-recurring-id').value
  if (recurringId && _editScopeRec === 'future') {
    // templateData：amount 用本金（base），fee 分開傳；後端自己算總額給 transactions
    const templateData = { name: data.name, amount: baseAmount, fee, category: data.category, card: data.card, note: data.note }
    const [r1, r2] = await Promise.all([
      id ? api.updateTransaction(id, data) : Promise.resolve({ ok: true }),
      api.updateRecurringFuture(recurringId, { ...templateData, transaction_id: id, from_date: data.date }),
    ])
    if (r1.ok && r2.ok) {
      closeTxnModal(); toast('已更新此筆及未來紀錄')
      await Promise.all([loadMonth(), loadRecurring()])
      if (selectedDate) renderDailyView(cachedTxns.filter(t => t.date === selectedDate))
      if (showMonthly) renderMonthlyTable()
    } else toast('部分更新失敗', 'error')
    return
  }

  const res = id ? await api.updateTransaction(id, data) : await api.addTransaction(data)
  if (res.ok) {
    closeTxnModal(); toast(id ? '已更新' : '已新增')
    await Promise.all([loadMonth(), loadRecurring()])
    if (selectedDate) renderDailyView(cachedTxns.filter(t => t.date === selectedDate))
    if (showMonthly) renderMonthlyTable()
  } else toast(res.error ?? '操作失敗', 'error')
}

window.renderCatList = function() {
  const exp = allCategories.filter(c=>c.type!=='收入').sort((a,b)=>a.sort_order-b.sort_order)

  h += exp.length ? exp.map((c,i)=>row(exp,c,i)).join('') : '<div class="text-muted text-small" style="padding:6px 0">尚無支出分類</div>'
  h += `<div style="font-size:11px;color:var(--text-muted);font-weight:600;padding:12px 0 4px;border-bottom:1px solid var(--border);margin-bottom:4px">收入分類</div>`
  h += inc.length ? inc.map((c,i)=>row(inc,c,i)).join('') : '<div class="text-muted text-small" style="padding:6px 0">尚無收入分類</div>'
  document.getElementById('cat-list').innerHTML = h
}

window.moveCat = async function(id,dir) {
  const cat = allCategories.find(c=>c.id===id); if(!cat) return
  const sibs = allCategories.filter(c=>c.type===cat.type).sort((a,b)=>a.sort_order-b.sort_order)
  const idx = sibs.findIndex(c=>c.id===id), si=idx+dir
  if(si<0||si>=sibs.length) return
  const other=sibs[si]
  if(cat.sort_order===other.sort_order) sibs.forEach((s,i)=>{s.sort_order=(i+1)*10})
  const tmp=cat.sort_order; cat.sort_order=other.sort_order; other.sort_order=tmp
  renderCatList(); renderCategorySelects()
  await Promise.all([api.updateCategory(cat.id,{sort_order:cat.sort_order}),api.updateCategory(other.id,{sort_order:other.sort_order})])
}

  const name=document.getElementById(iid).value.trim(); if(!name) return

async function loadRecurring() {
  const res = await api.getRecurring()
  if (res.ok) { recItems = res.data; renderRecurring() }
}

function renderRecurring() {
  const filtered = recItems
  const active = filtered.filter(i => i.is_active)
  const inactive = filtered.filter(i => !i.is_active)

  const activeAndStarted = i => i.is_active && (!i.start_date || i.start_date <= today) && (!i.end_date || i.end_date >= today)
  const monthlyExp = calcMonthlyEquiv(recItems.filter(i => activeAndStarted(i) && i.type !== '收入'))
  const monthlyInc = calcMonthlyEquiv(recItems.filter(i => activeAndStarted(i) && i.type === '收入'))
  const net = monthlyInc - monthlyExp
  document.getElementById('rec-monthly-bar').innerHTML = `
    <div class="monthly-bar-item"><div class="monthly-bar-label">月均支出</div><div class="monthly-bar-val" style="color:var(--danger)">NT$${monthlyExp.toLocaleString()}</div></div>
    <div class="monthly-bar-item"><div class="monthly-bar-label">月均收入</div><div class="monthly-bar-val" style="color:var(--success)">NT$${monthlyInc.toLocaleString()}</div></div>
    <div class="monthly-bar-item"><div class="monthly-bar-label">月均淨額</div><div class="monthly-bar-val" style="color:${net>=0?'var(--success)':'var(--danger)'}">NT$${Math.abs(net).toLocaleString()}</div></div>
    <div class="monthly-bar-item" style="margin-left:auto"><div class="monthly-bar-label">啟用項目</div><div class="monthly-bar-val">${active.length} 個</div></div>
  `

  const list = document.getElementById('rec-list')
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div style="font-size:40px;margin-bottom:10px">🔄</div><div style="font-weight:600;font-size:15px;margin-bottom:6px">尚無定期項目</div><div style="font-size:13px">點選右上角「＋新增」開始設定</div></div>`
    return
  }

  let html = ''
  const groups = [{ label:'啟用中', items:active }, { label:'已結束', items:inactive }]
  for (const g of groups) {
    if (!g.items.length) continue
    const gTotal = g.items.filter(i=>i.type!=='收入').reduce((s,i)=>s+calcMonthlyEquiv([i]),0)
    html += `<div class="rec-group-hd"><span>${g.label}（${g.items.length}）</span>${g.label==='啟用中'&&gTotal>0?`<span style="color:var(--danger)">月均 −NT$${gTotal.toLocaleString()}</span>`:''}</div>`
    for (const item of g.items) {
      const isInc = item.type === '收入'
      const daysUntil = Math.ceil((new Date(item.next_date) - new Date(today)) / 86400000)
      const dueSoon = daysUntil <= 3 && daysUntil >= 0
      const notStarted = item.start_date && item.start_date > today
      const hasEnded = item.end_date && item.end_date < today
      const dimStyle = !item.is_active ? 'opacity:0.45' : (notStarted || hasEnded ? 'opacity:0.38;filter:saturate(0.2)' : '')
      const statusTag = notStarted
        ? `<span style="font-size:10px;color:var(--text-muted);background:var(--surface2);border-radius:4px;padding:1px 5px">尚未開始</span>`
        : hasEnded
        ? `<span style="font-size:10px;color:var(--text-muted);background:var(--surface2);border-radius:4px;padding:1px 5px">已結束</span>`
        : ''
      const feeTag = item.fee > 0 ? `<span style="font-size:11px;color:var(--text-muted)">內含手續費 NT$${item.fee.toLocaleString()}</span>` : ''
      html += `<div class="rec-item" style="${dimStyle};cursor:pointer" onclick="openRecDetail('${item.id}')">
        ${resolvedCatIconHtml(item.category,40)}
        <div class="rec-item-info">
          <div class="rec-item-name" style="display:flex;align-items:center;gap:6px">${escHtml(item.name)}${statusTag}</div>
          <div class="rec-item-meta">
            ${escHtml(item.category)} · ${freqLabel(item.frequency,item.day_of_month)}${item.end_date?' · 至 '+item.end_date:''}${item.card?`<span class="rec-meta-sep"> · </span><span class="rec-meta-card">${escHtml(item.card)}</span>`:''}
          </div>
        </div>
        <div class="rec-item-right">
          <div class="rec-item-amt" style="color:${isInc?'var(--success)':'var(--danger)'}">NT$${(item.amount+(item.fee||0)).toLocaleString()}</div>
          ${feeTag}
          <div class="rec-item-next" style="${dueSoon&&!notStarted?'color:var(--warning)':''}">${dueSoon&&!notStarted?'⚠️ ':''}${notStarted?'起始 '+item.start_date:'下次 '+item.next_date}</div>
        </div>
        <div style="color:var(--text-muted);font-size:18px;padding:0 4px">›</div>
      </div>`
    }
  }
  list.innerHTML = html
}

function calcNextDateRec(dateStr, frequency, dayOfMonth = 1) {
  const [y, m, d] = dateStr.split('-').map(Number)
  if (frequency === 'weekly') {
    const dt = new Date(y, m - 1, d + 7)
    return dt.toISOString().slice(0, 10)
  }
  if (frequency === 'yearly') {
    const maxD = new Date(y + 1, m, 0).getDate()
    return `${y + 1}-${String(m).padStart(2,'0')}-${String(Math.min(d, maxD)).padStart(2,'0')}`
  }
  let ny = y, nm = m + 1
  if (nm > 12) { nm = 1; ny++ }
  const maxD = new Date(ny, nm, 0).getDate()
  return `${ny}-${String(nm).padStart(2,'0')}-${String(Math.min(dayOfMonth, maxD)).padStart(2,'0')}`
}

window.openRecDetail = async function(id) {
  const item = recItems.find(i => i.id === id)
  if (!item) return
  _recDetailCurrentId = id

  const isInc = item.type === '收入'
  const color = isInc ? 'var(--success)' : 'var(--danger)'

  document.getElementById('rcd-name').textContent = item.name
  document.getElementById('rcd-meta').textContent =
    `${item.category} · ${freqLabel(item.frequency, item.day_of_month)}${item.card ? ' · ' + item.card : ''}`
  document.getElementById('rcd-total').textContent = ''
  document.getElementById('rcd-total-label').textContent = ''
  document.getElementById('rcd-list').innerHTML =
    '<div style="padding:20px 0;text-align:center;color:var(--text-muted)">載入中…</div>'
  document.getElementById('rec-detail-modal').classList.add('open')
  document.getElementById('rcd-terminate-btn').style.display = item.is_active ? 'block' : 'none'

  const res = await api.getRecurringTransactions(id)
  const txns = (res.ok ? res.data ?? [] : []).sort((a, b) => a.date.localeCompare(b.date))

  const totalAmt = txns.reduce((s, t) => s + t.amount, 0)
  if (totalAmt) {
    document.getElementById('rcd-total').textContent = `NT$${totalAmt.toLocaleString()}`
    document.getElementById('rcd-total').style.color = color
    document.getElementById('rcd-total-label').textContent = '已累積'
  }

  let html = ''
  if (txns.length) {
    html += `<div style="font-size:11px;font-weight:600;color:var(--text-muted);padding:12px 0 6px;letter-spacing:.4px">歷史紀錄</div>`
  }
  txns.forEach((t, i) => {
    const [y, m, day] = t.date.split('-')
    const statusColor = t.status === '已對帳' ? 'var(--success)' : t.status === '待確認' ? 'var(--warning,#d29922)' : 'var(--text-muted)'
    html += `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(48,54,61,.4);cursor:pointer" onclick="openRecTxnEdit('${t.id}')">
      <div style="width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0">${i + 1}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:500">${y}/${m}/${day}</div>
        <div style="font-size:11px;color:${statusColor};margin-top:2px">${t.status}</div>
      </div>
      <div style="font-size:14px;font-weight:700;color:${color}">NT$${t.amount.toLocaleString()}</div>
    </div>`
  })
  if (item.is_active) {
    const futureDates = []
    let nd = item.next_date
    for (let i = 0; i < 6; i++) {
      futureDates.push(nd)
      nd = calcNextDateRec(nd, item.frequency, item.day_of_month)
    }
    if (futureDates.length) {
      html += `<div style="font-size:11px;font-weight:600;color:var(--text-muted);padding:12px 0 6px;letter-spacing:.4px">即將到來</div>`
    }
    futureDates.forEach((d, i) => {
      const [y, m, day] = d.split('-')
      html += `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(48,54,61,.2);opacity:0.6;cursor:pointer" onclick="generateAndEditFuture('${item.id}')">
        <div style="width:30px;height:30px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text-muted);flex-shrink:0">${i === 0 ? '次' : ''}</div>
        <div style="flex:1;font-size:14px;color:var(--text-muted)">${y}/${m}/${day}</div>
        <div style="font-size:14px;font-weight:600;color:${color}">NT$${(item.amount + (item.fee || 0)).toLocaleString()}</div>
      </div>`
    })
  }
  if (!txns.length && !item.is_active) html = '<div style="padding:24px 0;text-align:center;color:var(--text-muted)">尚無紀錄</div>'
  document.getElementById('rcd-list').innerHTML = html
}

function calcMonthlyEquiv(items) {
  return Math.round(items.reduce((s,i) => {
    const total = i.amount + (i.fee || 0)
    if(i.frequency==='weekly') return s+total*4.33
    if(i.frequency==='yearly') return s+total/12
    return s+total
  }, 0))
}

function nextDateForDay(day) {
  const now = new Date(), y=now.getFullYear(), m=now.getMonth()+1
  const d = String(day).padStart(2,'0')
  const cand = `${y}-${String(m).padStart(2,'0')}-${d}`
  if(cand >= today) return cand
  const nm=m===12?1:m+1, ny=m===12?y+1:y
  return `${ny}-${String(nm).padStart(2,'0')}-${d}`
}

window.saveRecurring = async function() {
  const id = document.getElementById('rec-edit-id').value
  const freq = document.getElementById('r-frequency').value
  const day = parseInt(document.getElementById('r-day').value)
  const startDate = document.getElementById('r-start-date').value
  const endDate = document.getElementById('r-end-date').value || null
  const data = {
    name: document.getElementById('r-name').value.trim(),
    amount: parseInt(document.getElementById('r-amount').value),
    fee: parseInt(document.getElementById('r-fee').value) || 0,
    type: recType,
    category: document.getElementById('r-category').value,
    card: document.getElementById('r-card').value,
    frequency: freq,
    day_of_month: freq==='monthly'?day:1,
    start_date: startDate,
    next_date: startDate,
    end_date: endDate,
  }
  if(!data.name||!data.amount||!data.start_date){toast('請填寫名稱、金額和起始日期','error');return}
  // 編輯時：若起始日期沒改，保留原本的 next_date，避免重複生成
  if (id) {
    const orig = recItems.find(i => i.id === id)
    const origStart = orig?.start_date || orig?.next_date
    if (orig && startDate === origStart) {
      data.next_date = orig.next_date  // 起始日期未改，保留原 next_date
    }
  }
  const res = id ? await api.updateRecurring(id,data) : await api.addRecurring(data)
  if(res.ok){
    if(!id && res.id) await api.generateRecurring(res.id)
    closeRecModal(); toast(id?'已更新':'已新增')
    const rr=await api.getRecurring()
    if(rr.ok){recItems=rr.data;renderRecurring()}
  } else toast(res.error??'操作失敗','error')
}

let _recDeleteId = null, _recDeleteName = ''

window.terminateRecDetail = async function() {
  const id = _recDetailCurrentId
  if (!id) return
  const item = recItems.find(i => i.id === id)
  if (!confirm(`確定要終止「${item?.name ?? ''}」？未到的待確認紀錄將刪除，歷史保留。`)) return
  const res = await api.terminateRecurring(id)
  if (res.ok) {
    document.getElementById('rec-detail-modal').classList.remove('open')
    toast(`「${item?.name ?? ''}」已終止，歷史紀錄保留`)
    await loadRecurring()
  } else toast(res.error ?? '操作失敗', 'error')
}

window.deleteRec = function(id, name) {
  _recDeleteId = id
  _recDeleteName = name
  document.getElementById('rec-delete-scope-modal').classList.add('open')
}

window.doDeleteRec = async function(scope) {
  const id = _recDeleteId
  const name = _recDeleteName
  document.getElementById('rec-delete-scope-modal').classList.remove('open')
  document.getElementById('rec-detail-modal').classList.remove('open')
  if (!id) return
  if (scope === 'terminate') {
    const res = await api.terminateRecurring(id)
    if (res.ok) { toast(`「${name}」已終止，歷史紀錄保留`); recItems = recItems.filter(i => i.id !== id); renderRecurring() }
    else toast(res.error ?? '操作失敗', 'error')
  } else {
    const res = await api.deleteRecurring(id)
    if (res.ok) { toast(`已刪除「${name}」，歷史交易紀錄保留`); recItems = recItems.filter(i => i.id !== id); renderRecurring() }
    else toast(res.error ?? '刪除失敗', 'error')
  }
}

window.triggerRecurring = async function() {
  const res = await api.processRecurring()
  if (res.ok) {
    if (res.count > 0) {
      toast(`已生成 ${res.count} 筆定期記錄`)
      await loadMonth()
    } else {
      toast('目前沒有到期的定期項目')
    }
    const rr = await api.getRecurring()
    if (rr.ok) { recItems = rr.data; renderRecurring() }
  } else toast(res.error ?? '生成失敗', 'error')
}

function escJs(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}

  if (calCard) {

      _sx = e.touches[0].clientX

    }, { passive: true })
    calCard.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - _sx
      const dy = e.changedTouches[0].clientY - _sy
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        dx < 0 ? changeMonth(1) : changeMonth(-1)
      }
    }, { passive: true })
  }

  // Modal 向下滑動關閉
  document.querySelectorAll('.modal').forEach(modal => {
    let sy = 0
    modal.addEventListener('touchstart', e => { sy = e.touches[0].clientY }, { passive: true })
    modal.addEventListener('touchend', e => {
      const dy = e.changedTouches[0].clientY - sy
      if (dy > 80 && modal.scrollTop === 0) {
        const overlay = modal.closest('.modal-overlay')
        if (overlay) overlay.classList.remove('open')
      }
    }, { passive: true })
  })
}

window.openMobileAdd = function(date) {
  location.href = '/add.html' + (date ? '?date=' + date : '')
}

// 從 add.html 返回時重新整理資料
window.addEventListener('pageshow', function(e) {
  if (e.persisted) {
    swr.delete('txns-' + currentMonth)
    loadMonth()
  }
})
</script>
