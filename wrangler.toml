name = "ricky-finance"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "ricky-finance-db"
database_id = "your-database-id-here"

[triggers]
crons = ["0 16 * * *"]

[vars]
APP_NAME = "瑞奇財務"
GMAIL_CLIENT_ID = ""
GMAIL_CLIENT_SECRET = ""
GMAIL_REFRESH_TOKEN = ""

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true
